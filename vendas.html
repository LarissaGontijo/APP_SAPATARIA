<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vendas</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Sistema de Vendas</h1>

        <nav>
            <a href="vendas.html">Vendas</a>
            <a href="estoque.html">Estoque</a>
            <a href="index.html">Sair</a>
        </nav>
    </header>

    <main>

        <section class="card">

            <h2>Cadastro de Venda</h2>

            <form id="formVenda">

                <label for="idVendas">ID da Venda</label>
                <input type="number" id="idVendas" required>

                <label for="nomeProduto">Nome do Produto</label>
                <input type="text" id="nomeProduto" required>

                <label for="descricaoProduto">Descrição do Produto</label>
                <textarea id="descricaoProduto" required></textarea>

                <label for="valorVenda">Valor da Venda</label>
                <input type="number" id="valorVenda" step="0.01" required>

                <button type="submit">Cadastrar Venda</button>

            </form>

        </section>


        <section class="card">

            <h2>Vendas cadastradas</h2>

            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Produto</th>
                        <th>Descrição</th>
                        <th>Valor</th>
                        <th>Ação</th>
                    </tr>
                </thead>

                <tbody id="listaVendas"></tbody>

            </table>

        </section>

    </main>

    <script>

        const formVenda = document.getElementById("formVenda");

        function carregarVendas() {

            const vendas = JSON.parse(localStorage.getItem("vendas")) || [];

            const lista = document.getElementById("listaVendas");

            lista.innerHTML = "";

            vendas.forEach((venda, index) => {

                lista.innerHTML += `
                    <tr>
                        <td>${venda.id}</td>
                        <td>${venda.nome}</td>
                        <td>${venda.descricao}</td>
                        <td>R$ ${Number(venda.valor).toFixed(2)}</td>
                        <td>
                            <button onclick="excluirVenda(${index})">
                                Excluir
                            </button>
                        </td>
                    </tr>
                `;

            });
        }


        formVenda.addEventListener("submit", function(event) {

            event.preventDefault();

            const venda = {

                id: document.getElementById("idVendas").value,

                nome: document.getElementById("nomeProduto").value,

                descricao: document.getElementById("descricaoProduto").value,

                valor: document.getElementById("valorVenda").value

            };

            const vendas = JSON.parse(localStorage.getItem("vendas")) || [];

            vendas.push(venda);

            localStorage.setItem("vendas", JSON.stringify(vendas));

            formVenda.reset();

            carregarVendas();

        });


        function excluirVenda(index) {

            const vendas = JSON.parse(localStorage.getItem("vendas")) || [];

            vendas.splice(index, 1);

            localStorage.setItem("vendas", JSON.stringify(vendas));

            carregarVendas();

        }

        carregarVendas();

    </script>
